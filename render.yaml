databases:
  - name: growell-db
    plan: free
    databaseName: growell
    user: growell

services:
  - type: web
    name: growell-ai-2
    runtime: node
    rootDir: .
    buildCommand: cd client && npm install && npm run build
    startCommand: node server.js

    # Subscription state is written by the Razorpay webhook. A
    # webhook that cannot reach the database is retried by
    # Razorpay, so a brief downtime does not lose a payment.
    healthCheckPath: /api/status

    envVars:
      - key: NODE_VERSION
        value: 22.22.0

      - key: DATABASE_URL
        fromDatabase:
          name: growell-db
          property: connectionString

      # Migrations reject a non-TLS connection unless this is set
      # to false. Local Postgres usually needs false.
      - key: DATABASE_SSL
        value: "true"

      - key: JWT_SECRET
        generateValue: true

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # The plan id from the Razorpay dashboard. This is the
      # price the farmer is actually charged.
      - key: RAZORPAY_PREMIUM_PLAN_ID
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_VISION_MODEL
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
