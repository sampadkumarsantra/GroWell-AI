<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroWell AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌱 GroWell AI</h1>

    <p class="tagline">
        Your Intelligent Farming Companion
    </p>

    <div class="chat">

        <div id="messages">
            <div class="bot">
                👋 Welcome! Ask me anything about farming.
            </div>
        </div>

        <div class="input-area">
            <input
                id="userInput"
                type="text"
                placeholder="Example: My rice leaves are turning yellow..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
